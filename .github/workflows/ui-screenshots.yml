name: UI Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/**'
      - 'app/src/screenshotTest/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ui-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.1'
      - name: Render Compose reference screenshots
        run: gradle --no-daemon updateDebugScreenshotTest
      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: MetaPOVBridge-ui-screenshots
          path: app/src/screenshotTestDebug/reference/**/*.png
          if-no-files-found: error
