name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require docs with app changes
        shell: bash
        run: |
          CHANGED="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -Eq '^(app/|build.gradle.kts$|settings.gradle.kts$|gradle.properties$)'; then
            if ! echo "$CHANGED" | grep -Eq '^(README\.md$|docs/)'; then
              echo "::error::Application/build code changed without a README.md or docs/ update."
              exit 1
            fi
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.1'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetaPOVBridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
