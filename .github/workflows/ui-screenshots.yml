name: UI Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/**'
      - 'app/src/screenshotTest/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ui-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.1'
      - name: Render Compose reference screenshots
        run: gradle --no-daemon updateDebugScreenshotTest
      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: MetaPOVBridge-ui-screenshots
          path: app/src/screenshotTestDebug/reference/**/*.png
          if-no-files-found: error

      - name: Publish screenshots to docs
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/images/ui

          cp "$(find app/src/screenshotTestDebug/reference -name 'IdleScreenshot_*.png' -print -quit)" docs/images/ui/idle.png
          cp "$(find app/src/screenshotTestDebug/reference -name 'MockReadyScreenshot_*.png' -print -quit)" docs/images/ui/mock-ready.png
          cp "$(find app/src/screenshotTestDebug/reference -name 'StreamingScreenshot_*.png' -print -quit)" docs/images/ui/streaming.png
          cp "$(find app/src/screenshotTestDebug/reference -name 'ErrorScreenshot_*.png' -print -quit)" docs/images/ui/error.png

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/ui

          if git diff --cached --quiet; then
            echo "UI screenshots unchanged."
            exit 0
          fi

          git commit -m "docs: refresh UI screenshots"
          git push
